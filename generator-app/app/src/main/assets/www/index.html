<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Générateur de Code</title>
<style>:root{font-family:system-ui,sans-serif;color:#102a43;background:#eef5f8}*{box-sizing:border-box}body{margin:0;padding:24px}.card{max-width:720px;margin:auto;background:#fff;padding:28px;border-radius:20px;box-shadow:0 14px 38px #183b5622}h1{margin-top:0;color:#0c4a6e}.warning{background:#fff3cd;border:1px solid #efcf70;padding:12px;border-radius:10px;font-weight:700}label{display:block;margin-top:18px;font-weight:800}input,textarea,button{width:100%;font:inherit;border-radius:10px}input,textarea{border:1px solid #b8cbd6;padding:13px;margin-top:7px}textarea{min-height:130px;resize:vertical}button{margin-top:20px;border:0;padding:14px;background:#0c6f8f;color:#fff;font-weight:900}.secondary{background:#526d82}.status{min-height:24px;font-weight:800;color:#147d4e}.device{font-family:monospace}</style></head>
<body><main class="card"><h1>Générateur de Code</h1><p class="warning">Application strictement réservée à l’administrateur. Ne jamais la transmettre aux étudiants.</p>
<label for="requestCode">Demande d’activation envoyée par l’étudiant</label><textarea id="requestCode" placeholder="Collez ici la demande reçue"></textarea><button id="readRequest" class="secondary">Lire les informations de l’étudiant</button><div id="studentInfo" class="warning" hidden></div>
<label for="personalCode">Code personnel de l’étudiant</label><input id="personalCode" autocomplete="off" placeholder="Exemple : TB886"><label for="deviceId">Identifiant affiché par son téléphone</label><input id="deviceId" class="device" autocomplete="off" placeholder="Exemple : ANDROID-…"><button id="generate">Créer le code d’activation</button><label for="activationToken">Code d’activation à transmettre</label><textarea id="activationToken" readonly></textarea><button id="copy" class="secondary">Copier le code d’activation</button><p id="status" class="status"></p></main>
<script>
const APP_ID='ci.tirbucebeda.revision';const PRIVATE_KEY=__PRIVATE_JWK__;
const normalize=value=>String(value||'').trim().replace(/\s+/g,'').toUpperCase();
const base64url=bytes=>btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'');
const fromBase64url=value=>{const base64=value.replace(/-/g,'+').replace(/_/g,'/');const padded=base64+'='.repeat((4-base64.length%4)%4);return Uint8Array.from(atob(padded),c=>c.charCodeAt(0));};
document.getElementById('readRequest').addEventListener('click',()=>{const status=document.getElementById('status');try{const raw=document.getElementById('requestCode').value.trim();if(!raw.startsWith('DEMANDE-ACTIVATION.'))throw new Error('Format de demande incorrect.');const data=JSON.parse(new TextDecoder().decode(fromBase64url(raw.split('.')[1])));document.getElementById('personalCode').value=data.code||'';document.getElementById('deviceId').value=data.device||'';const info=document.getElementById('studentInfo');info.hidden=false;info.innerHTML='<strong>Nom et prénoms :</strong> '+(data.name||'-')+'<br><strong>Téléphone :</strong> '+(data.phone||'-')+'<br><strong>Filière :</strong> '+(data.track||'-')+'<br><strong>Antenne :</strong> '+(data.branch||'-');status.textContent='Informations chargées. Vous pouvez créer le code d’activation.';}catch(error){status.textContent='Impossible de lire la demande : '+error.message}});
document.getElementById('generate').addEventListener('click',async()=>{const code=normalize(document.getElementById('personalCode').value);const device=normalize(document.getElementById('deviceId').value);const status=document.getElementById('status');if(!code||!device){status.textContent='Saisissez le code personnel et l’identifiant du téléphone.';return}try{const payloadBytes=new TextEncoder().encode(JSON.stringify({v:1,app:APP_ID,code,device,issuedAt:Date.now()}));const key=await crypto.subtle.importKey('jwk',PRIVATE_KEY,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);const signature=new Uint8Array(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},key,payloadBytes));document.getElementById('activationToken').value=base64url(payloadBytes)+'.'+base64url(signature);status.textContent='Code d’activation créé.';}catch(error){status.textContent='Échec de la génération : '+error.message}});
document.getElementById('copy').addEventListener('click',async()=>{const token=document.getElementById('activationToken').value;if(!token)return;try{await navigator.clipboard.writeText(token);document.getElementById('status').textContent='Code copié.'}catch(_){document.getElementById('activationToken').select();document.execCommand('copy');document.getElementById('status').textContent='Code copié.'}});
</script></body></html>
